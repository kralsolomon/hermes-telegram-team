# Hermes profile config for the RESEARCHER agent.

model:
  provider: anthropic
  # Small, fast and cheap: reads several web pages per task, little reasoning needed.
  default: claude-haiku-4-5-20251001

# Needs: web, skills, memory, session_search. Not needed: code / shell.
agent:
  disabled_toolsets:
    - terminal
    - code_execution
    - image_gen
    - tts
    - delegation
    - session_search      # don't copy formats from old sessions
    - browser
    - vision
    - file
    - todo
    - clarify
    - cronjob

group_sessions_per_user: false

telegram:
  require_mention: true
  exclusive_bot_mentions: true
  bots_require_mention: true
  observe_unmentioned_group_messages: false   # only sees tasks addressed to it
  mention_patterns: []
  reactions: true

gateway:
  bot_loop_guard:
    enabled: true
    max_events: 20
    window_seconds: 300
    cooldown_seconds: 600

memory:
  memory_enabled: true          # e.g. "statistics sites that worked well"
  user_profile_enabled: false   # it never talks to the human directly
  write_approval: false

display:
  memory_notifications: off

# Saves tokens: no background self-review after every turn
auxiliary:
  background_review:
    enabled: false

# Web search backend (keyless, rate-limited). Add TAVILY_API_KEY in .env for higher limits.
web:
  backend: tavily
